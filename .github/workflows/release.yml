name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read   # restrictive default; jobs override below

jobs:
  # ---------------------------------------------------------------------------
  # 1. Docker image — build and push to ghcr.io
  # ---------------------------------------------------------------------------
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      packages: write      # push to ghcr.io
      id-token: write      # keyless cosign signing (OIDC token)
      attestations: write  # publish build provenance attestations
      contents: read
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # tag with the full semver, e.g. v1.2.3
            type=semver,pattern={{version}}
            # tag with major.minor, e.g. v1.2
            type=semver,pattern={{major}}.{{minor}}
            # always update :latest on a release tag
            type=raw,value=latest,enable=true

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attach an SPDX SBOM so kpil's startup staleness check can read
          # the baked-in claude/opencode versions without pulling the image.
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign image
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: Generate build provenance attestation (image)
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # 2. Go binaries — cross-compile and publish GitHub Release via GoReleaser
  # ---------------------------------------------------------------------------
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: docker           # attach release notes only after image is pushed
    permissions:
      contents: write      # create GitHub release and upload assets
      id-token: write      # OIDC token for attestations
      attestations: write  # publish build provenance attestations
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0    # GoReleaser needs the full git history for changelog

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build provenance attestation (binaries)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

  # ---------------------------------------------------------------------------
  # 3. Krew index — auto-open a PR against kubernetes-sigs/krew-index
  # ---------------------------------------------------------------------------
  krew:
    name: Update krew-index
    runs-on: ubuntu-latest
    needs: goreleaser   # release must exist before the bot can fetch assets
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update plugin in krew-index
        uses: rajatjindal/krew-release-bot@v0.0.51
