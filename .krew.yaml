apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kpil
spec:
  version: {{ .TagName }}
  homepage: https://github.com/qjoly/kpil
  shortDescription: Run Copilot CLI with a scoped kubeconfig
  description: |
    kpil provisions a temporary, read-only Kubernetes ServiceAccount
    (secrets excluded), generates a short-lived kubeconfig, and launches
    the GitHub Copilot CLI inside an isolated container.
    All RBAC resources and the kubeconfig are deleted on exit.

    Requires Docker or Podman and a GH_TOKEN with copilot access.
  caveats: |
    GH_TOKEN must be set before running:
      export GH_TOKEN=github_pat_xxxxxxxxxxxx
    Docker or Podman must be running locally.
  platforms:
  {{- $ver := slice .TagName 1 }}
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha (printf "https://github.com/qjoly/kpil/releases/download/%s/kpil_%s_darwin_arm64.tar.gz" .TagName $ver) .TagName }}
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha (printf "https://github.com/qjoly/kpil/releases/download/%s/kpil_%s_darwin_amd64.tar.gz" .TagName $ver) .TagName }}
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha (printf "https://github.com/qjoly/kpil/releases/download/%s/kpil_%s_linux_arm64.tar.gz" .TagName $ver) .TagName }}
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha (printf "https://github.com/qjoly/kpil/releases/download/%s/kpil_%s_linux_amd64.tar.gz" .TagName $ver) .TagName }}
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha (printf "https://github.com/qjoly/kpil/releases/download/%s/kpil_%s_windows_amd64.zip" .TagName $ver) .TagName }}
    files:
    - from: kpil.exe
      to: .
    - from: LICENSE
      to: .
    bin: kpil.exe
