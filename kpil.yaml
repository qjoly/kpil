apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: kpil
spec:
  version: "v0.1.1"
  homepage: https://github.com/qjoly/kpil
  shortDescription: Run Copilot CLI with a scoped kubeconfig
  description: |
    kpil provisions a temporary, read-only Kubernetes ServiceAccount
    (secrets excluded), generates a short-lived kubeconfig, and launches
    the GitHub Copilot CLI inside an isolated container.
    All RBAC resources and the kubeconfig are deleted on exit.

    Requires Docker or Podman and a GH_TOKEN with copilot access.
  caveats: |
    GH_TOKEN must be set before running:
      export GH_TOKEN=github_pat_xxxxxxxxxxxx
    Docker or Podman must be running locally.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    uri: https://github.com/qjoly/kpil/releases/download/v0.1.1/kpil_0.1.1_darwin_arm64.tar.gz
    sha256: "2a7ef4a040ea874b507fc76dfecfc502a1760a4f90de3ce6e1684d9e7fbe5d39"
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    uri: https://github.com/qjoly/kpil/releases/download/v0.1.1/kpil_0.1.1_darwin_amd64.tar.gz
    sha256: "1a7a3497c10803c915c4f9f810932a597801356537625ed3508e7d331e9b6a3f"
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: linux
        arch: arm64
    uri: https://github.com/qjoly/kpil/releases/download/v0.1.1/kpil_0.1.1_linux_arm64.tar.gz
    sha256: "8c8bfb7c56d19525529fa0a214c58bfcc4551841040073316c1c9e256a6c66d7"
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: linux
        arch: amd64
    uri: https://github.com/qjoly/kpil/releases/download/v0.1.1/kpil_0.1.1_linux_amd64.tar.gz
    sha256: "020f5e63f83f006f18ba73d8b70d8f84041d94843ebbcbf6b7809bff006add61"
    files:
    - from: kpil
      to: .
    - from: LICENSE
      to: .
    bin: kpil

  - selector:
      matchLabels:
        os: windows
        arch: amd64
    uri: https://github.com/qjoly/kpil/releases/download/v0.1.1/kpil_0.1.1_windows_amd64.zip
    sha256: "50ef0a8c4769938d46ba921e9f5fbeba47cb027ed59f9bbae0e6ff3f4e06677d"
    files:
    - from: kpil.exe
      to: .
    - from: LICENSE
      to: .
    bin: kpil.exe
